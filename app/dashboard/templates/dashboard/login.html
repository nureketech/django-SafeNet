{% extends "dashboard/base.html" %}
{% block title %}{{ t.login_title }} · SafeNet KZ{% endblock %}
{% block content %}
<section class="login panel">
  <h1>{{ t.login_title }}</h1>
  {% if form.non_field_errors %}
    <p class="error" data-role="error">{% for e in form.non_field_errors %}{{ e }}{% endfor %}</p>
  {% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <label><span>{{ form.username.label }}</span>
      <input type="text" name="username" autocomplete="username" required autofocus
             value="{{ form.username.value|default:'' }}" maxlength="150">
    </label>
    <label><span>{{ form.password.label }}</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn primary">{{ t.login_submit }}</button>
  </form>
</section>
{% endblock %}
