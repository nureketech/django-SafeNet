    name_ru: "Промокод / бонус к депозиту"
    name_kk: "Промокод / депозитке бонус"
    weight: 10
    core: false
    description: "Промокоды, бонусы к депозиту, фриспины по коду"
    entities: [promo_code]
    keywords_ru: ["промокод", "промик", "промо-код", "бонус-код", "промокоды на"]
    keywords_kk: ["промокод", "промик"]
    patterns:
      # cashback counts only in a gambling context (bank and shop cashback is ordinary commerce)
      - 'кешбэк\w*(?=[^\n]{0,40}(?:проигрыш|казино|слот|ставк|депозит|деп\b))'
      - '(?:проигрыш|казино|слот|ставк)\w*[^\n]{0,40}кешбэк'
      - 'бонус\w*\s+(?:\d+\s?%|до\s+\d|на\s+(?:первый\s+)?деп|к\s+деп|за\s+регистрац|новичк|на\s+баланс)'
      - '\d+\s?%\s+(?:бонус|к депозиту|на депозит)'
      - '(?:\d+|фри)\s*(?:фриспин|fs|фс)\w*'
      - 'депозитке\s+(?:\d+\s?%\s+)?бонус'
      - 'бонус\w*\s+(?:раздают|бар|от меня)'
      - 'фриспин\w*\s+без\s+деп'
    exclude:
      window: 40
      # bank bonuses and shop promo codes («с каждой оплаты возвращают 50% бонусов», «скидка 10% по промокоду»)
      patterns: ['скидк', 'жеңілдік', '(?<![а-я])банк', 'с каждой оплат', 'на весь заказ', '(?<![а-я])магазин']

