# SafeNet KZ — signals dictionary.
#
# The system reports SIGNS of a possible violation, never a verdict. Every signal
# that fires is shown to the analyst with its evidence (a span of the original text).
#
# Matching runs on the *folded* normalised text (stage 2): lower case, homoglyphs and
# transliteration resolved, Kazakh-specific letters folded (қ→к, ұ/ү→у, і→и, ә→а ...).
# Keywords and patterns below are folded automatically, so they may be written in
# normal Kazakh / Russian spelling.
#
# Fields
#   id, track (common|lottery|casino|pyramid|negative), name_ru, name_kk, weight, core,
#   description
#   keywords_ru / keywords_kk  word stems; every word of a phrase matches as a prefix
#                              (words of <= 2 letters match exactly)
#   patterns                   regular expressions (Python syntax)
#   entities                   stage-2 entity kinds that trigger the signal
#   computed                   name of a computed check (signals/computed.py)
#   near_amount                {window, min_value}: a keyword/pattern hit counts only with an
#                              amount entity nearby (e.g. «взнос 1000 тг»)
#   context                    {window, patterns}: hit counts only with this context nearby
#   exclude                    {window, patterns}: hit is dropped when this context is nearby
#   emoji_ok                   true if evidence may consist of an emoji only (🎰 -> казино)

signals:
  # ------------------------------------------------------------------ common
  - id: C_PAY_TRANSFER
    track: common
    name_ru: "Перевод на карту / Kaspi"
    name_kk: "Картаға / Kaspi-ге аударым"
    weight: 8
    core: false
    description: "Оплата переводом на карту, Kaspi или по номеру телефона; «реквизиты в личке»"
    entities: [kaspi, card]
    keywords_ru: ["реквизит", "оплата переводом", "переводом на", "перевод на карт", "перевод по номер",
                  "перевод на номер", "скидываем на", "скидывайте на", "кидайте на", "кидать на карт",
                  "закинь на карт", "оплата на карт", "оплатить на карт", "скинь на карт", "переведите на",
                  "переводите на", "перевести деньги на", "перевести на карт", "чек скиньте", "выводим на карт",
                  "выплаты на карт"]
    keywords_kk: ["аударым", "аударыңыз", "аударыңдар", "аударып", "аударасыз", "аудару", "реквизит",
                  "картаға салыңыз", "картама салыңдар", "нөміріне салыңыз", "картаға аудар", "картасына төле"]
    patterns:
      - '(?:картаг\w*|картама|карточк\w*|номирин\w*)\s+(?:сал\w*|аудар\w*|тол\w*)'
      - 'перевод\w*\s+(?:на\s+)?(?:мою|мой|личн\w*)?\s*(?:карт|каспи|номер)\w*'
      - '(?:взнос|оплат\w*)\s+\d[\d\s]*\s*(?:тг|тенге|₸)?\s+на\s+(?:карт|каспи)\w*'
    exclude:
      window: 25
      # Kaspi as a brand or product name («Kaspi.kz», «Kaspi Магазин», «Kaspi Red») is not a transfer request
      patterns: ['аудармаңыз', 'не переводите', '(?:kaspi|каспи)\.kz', '(?:kaspi|каспи)\s+(?:магазин|travel|гид|pay|qr|red|депозит|жұма|бизнес)',
                 'суперприложени']

