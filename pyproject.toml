[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safenet"
version = "0.1.0"
description = "SafeNet KZ: әлеуметтік желілердегі ықтимал заңсыз схемалардың белгілерін анықтау прототипі"
readme = "README.md"
requires-python = ">=3.11"
# Exact versions are pinned in requirements.txt.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "app.settings"
addopts = "-ra -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:pyvis.*"]
